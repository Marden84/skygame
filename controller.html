<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SkyCoins Controller</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100dvh;
      background: linear-gradient(160deg, #0f0c29, #302b63, #24243e);
      color: white;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.4rem;
      user-select: none;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    h1 { font-size: 2.2rem; letter-spacing: 3px; }

    #status {
      font-size: 1.05rem; text-align: center;
      padding: 10px 26px; border-radius: 30px;
      background: rgba(255,255,255,0.08);
      max-width: 90vw;
    }
    .ok    { background: rgba(0,200,80,0.28)  !important; }
    .error { background: rgba(200,30,30,0.28) !important; }

    /* Tilt visualiser */
    #ring {
      width: 170px; height: 170px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.18);
      background: radial-gradient(circle, rgba(255,255,255,0.04), transparent 70%);
      position: relative;
    }
    #dot {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: #ffd700;
      box-shadow: 0 0 16px #ffd700, 0 0 32px rgba(255,215,0,0.4);
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #btn-start {
      display: none;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; border: none;
      padding: 18px 48px; border-radius: 50px;
      font-size: 1.15rem; cursor: pointer;
      box-shadow: 0 4px 22px rgba(102,126,234,0.45);
      transition: transform .1s;
    }
    #btn-start:active { transform: scale(0.95); }

    #hint { font-size: 0.88rem; opacity: 0.5; text-align: center; padding: 0 2.5rem; }

    #score-display { font-size: 2rem; font-weight: bold; color: #ffd700; letter-spacing: 2px; }

    /* Crosshair lines inside ring */
    #ring::before, #ring::after {
      content: '';
      position: absolute; background: rgba(255,255,255,0.1);
    }
    #ring::before { width: 1px; height: 100%; left: 50%; top: 0; }
    #ring::after  { height: 1px; width: 100%; top: 50%; left: 0; }

    /* Landscape hint banner */
    #landscape-hint {
      display: none;
      background: rgba(255,215,0,0.12);
      border: 1px solid rgba(255,215,0,0.35);
      border-radius: 12px;
      padding: 10px 20px;
      font-size: 0.9rem;
      text-align: center;
      max-width: 90vw;
      color: #ffd700;
    }

    /* Calibration overlay */
    #calib-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(8, 6, 35, 0.94);
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.2rem;
      z-index: 50;
      text-align: center;
      padding: 2rem;
    }
    #calib-countdown {
      font-size: 5rem; font-weight: bold;
      color: #ffd700; line-height: 1;
      text-shadow: 0 0 30px rgba(255,215,0,0.6);
      min-width: 2ch; text-align: center;
    }
    #calib-bar-track {
      width: 80vw; max-width: 320px;
      height: 8px;
      background: rgba(255,255,255,0.12);
      border-radius: 4px; overflow: hidden;
    }
    #calib-bar-fill {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #667eea, #ffd700);
      border-radius: 4px;
      transform-origin: left;
    }
  </style>
</head>
<body>

  <h1>✈️ SkyCoins</h1>
  <div id="status">Verbinde mit Spiel…</div>

  <div id="ring"><div id="dot"></div></div>

  <p id="landscape-hint">📱 Drehe dein Handy quer (Landscape)</p>

  <button id="btn-start" onclick="requestPerm()">🎮 Sensor freigeben</button>

  <p id="hint">Neige dein Handy, um das Flugzeug zu steuern</p>
  <div id="score-display">🪙 <span id="sc">0</span></div>

  <div id="calib-overlay">
    <p style="font-size:1.1rem; opacity:0.85; max-width:80vw; line-height:1.6;">
      Halte dein Handy in deiner<br>bequemen Steuerposition
    </p>
    <div id="calib-countdown">5</div>
    <div id="calib-bar-track"><div id="calib-bar-fill"></div></div>
    <p style="font-size:0.85rem; opacity:0.5;">Das Spiel startet automatisch</p>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>

    const params   = new URLSearchParams(location.search);
    const hostId   = params.get('peer');
    const statusEl = document.getElementById('status');
    const dot      = document.getElementById('dot');
    const ring     = document.getElementById('ring');
    const scEl     = document.getElementById('sc');

    let beta = 0, gamma = 0;
    let neutralBeta = 0, neutralGamma = 0;
    let smoothBeta = 0, smoothGamma = 0;
    let smoothAx = 0, smoothAy = 0, smoothAz = -9.8;
    let calibSamples = [];
    let calibrating = false, calibDone = false;
    let conn = null, connected = false, sendLoop = null;

    const TILT_RANGE = 30;   // ±30° = volle Auslenkung
    const SMOOTH     = 0.20; // EMA für Ausgabe
    const ACC_SMOOTH = 0.35; // EMA für Accelerometer-Rohwerte

    // ── Landscape helpers ───────────────────────────────────────────────────
    function getLandscapeSign() {
      const angle = (screen.orientation?.angle ?? window.orientation ?? 0);
      return angle === 270 ? -1 : 1;
    }

    // ── No game ID in URL ───────────────────────────────────────────────────
    if (!hostId) {
      statusEl.textContent = '❌ Kein Spiel gefunden – QR-Code erneut scannen';
      statusEl.className   = 'error';
    }

    // ── PeerJS ──────────────────────────────────────────────────────────────
    const peer = new Peer(undefined, { debug: 0 });

    peer.on('open', () => { if (hostId) connect(); });

    function connect() {
      statusEl.textContent = 'Verbinde mit Spiel…';
      conn = peer.connect(hostId, { reliable: false, serialization: 'json' });

      conn.on('open', () => {
        connected = true;
        statusEl.textContent = '✅ Verbunden!';
        statusEl.className   = 'ok';

        // Show landscape nudge
        document.getElementById('landscape-hint').style.display = 'block';

        // iOS 13+ requires user gesture for sensor access
        const needsPerm =
          (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') ||
          (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function');
        if (needsPerm) {
          document.getElementById('btn-start').style.display = 'block';
          document.getElementById('hint').textContent = 'Tippe den Button, um den Sensor freizugeben';
        } else {
          startSensors();
        }
      });

      conn.on('data', d => {
        if (d.type === 'score') scEl.textContent = d.value;
      });

      conn.on('close', () => {
        connected = false;
        clearInterval(sendLoop);
        statusEl.textContent = '❌ Verbindung getrennt';
        statusEl.className   = 'error';
      });

      conn.on('error', err => {
        statusEl.textContent = '❌ Fehler: ' + err;
        statusEl.className   = 'error';
      });
    }

    // ── iOS permission request ───────────────────────────────────────────────
    function requestPerm() {
      const reqs = [];
      if (typeof DeviceMotionEvent?.requestPermission === 'function')
        reqs.push(DeviceMotionEvent.requestPermission());
      if (typeof DeviceOrientationEvent?.requestPermission === 'function')
        reqs.push(DeviceOrientationEvent.requestPermission());
      Promise.all(reqs)
        .then(() => { document.getElementById('btn-start').style.display = 'none'; startSensors(); })
        .catch(() => { statusEl.textContent = '❌ Sensor-Berechtigung verweigert'; statusEl.className = 'error'; });
    }

    // ── Sensor reading + calibration ────────────────────────────────────────
    function startSensors() {
      document.getElementById('landscape-hint').style.display = 'none';
      document.getElementById('hint').textContent = 'Kalibrierung läuft…';

      const CALIB_MS     = 5000;
      const calibOverlay = document.getElementById('calib-overlay');
      const calibCountEl = document.getElementById('calib-countdown');
      const calibBarFill = document.getElementById('calib-bar-fill');

      calibrating  = true;
      calibSamples = [];
      calibOverlay.style.display = 'flex';

      const calibStart = performance.now();

      window.addEventListener('devicemotion', onMotion);

      const calibTick = setInterval(() => {
        const elapsed  = performance.now() - calibStart;
        const progress = Math.min(elapsed / CALIB_MS, 1);
        const secsLeft = Math.max(0, Math.ceil((CALIB_MS - elapsed) / 1000));
        calibCountEl.textContent = secsLeft;
        calibBarFill.style.transform = `scaleX(${1 - progress})`;
        if (progress >= 1) { clearInterval(calibTick); finishCalibration(); }
      }, 100);
    }

    // Accelerometer-basiert: kein Gimbal-Lock möglich
    // Schwerkraft-Vektor → atan2 → Neigungswinkel (mathematisch stabil bis 90°)
    function onMotion(e) {
      const acc = e.accelerationIncludingGravity;
      if (!acc) return;

      // Low-pass filter auf Accelerometer-Rohwerte (filtert Vibrations-Rauschen)
      smoothAx += ((acc.x ?? 0) - smoothAx) * ACC_SMOOTH;
      smoothAy += ((acc.y ?? 0) - smoothAy) * ACC_SMOOTH;
      smoothAz += ((acc.z ?? -9.8) - smoothAz) * ACC_SMOOTH;

      // Neigungswinkel aus Schwerkraft-Vektor — kein Gimbal-Lock
      const vGamma = Math.atan2(smoothAx, -smoothAz) * (180 / Math.PI);
      const vBeta  = Math.atan2(smoothAy, -smoothAz) * (180 / Math.PI);

      if (calibrating) {
        calibSamples.push({ beta: vBeta, gamma: vGamma });
        updateDot(vBeta, vGamma, 45, 45);
      } else if (calibDone) {
        const dBeta  = vBeta  - neutralBeta;
        const dGamma = vGamma - neutralGamma;
        const sign   = getLandscapeSign();

        const clamp = v => Math.max(-TILT_RANGE, Math.min(TILT_RANGE, v));
        const rawB =  sign * dGamma;
        const rawG =  sign * dBeta;

        smoothBeta  += (clamp(rawB) - smoothBeta)  * SMOOTH;
        smoothGamma += (clamp(rawG) - smoothGamma) * SMOOTH;
        beta  = smoothBeta;
        gamma = smoothGamma;

        updateDot(beta, gamma, TILT_RANGE, TILT_RANGE);
      }
    }

    function updateDot(b, g, rangeB, rangeG) {
      const rPx = ring.clientWidth / 2 - 17;
      const rx  = Math.max(-1, Math.min(1, g / rangeG));
      const ry  = Math.max(-1, Math.min(1, b / rangeB));
      dot.style.left = (ring.clientWidth  / 2 + rx * rPx) + 'px';
      dot.style.top  = (ring.clientHeight / 2 + ry * rPx) + 'px';
    }

    function finishCalibration() {
      calibrating = false;
      if (calibSamples.length > 0) {
        neutralBeta  = calibSamples.reduce((s, x) => s + x.beta,  0) / calibSamples.length;
        neutralGamma = calibSamples.reduce((s, x) => s + x.gamma, 0) / calibSamples.length;
      }
      calibDone = true;
      document.getElementById('calib-overlay').style.display = 'none';
      document.getElementById('hint').textContent = 'Neige dein Handy, um das Flugzeug zu steuern';
      if (connected && conn?.open) conn.send({ type: 'calibrated' });

      sendLoop = setInterval(() => {
        if (connected && conn?.open) conn.send({ type: 'tilt', beta, gamma });
      }, 40);
    }

    peer.on('error', () => {
      statusEl.textContent = '❌ Verbindungsfehler – Seite neu laden';
      statusEl.className   = 'error';
    });

  </script>
</body>
</html>
