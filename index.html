<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyCoins</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }

    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0, 20, 60, 0.88);
      color: white; z-index: 100;
    }
    #overlay h1 { font-size: 3.5rem; margin-bottom: 0.4rem; letter-spacing: 3px; }
    #overlay .sub { font-size: 1.1rem; opacity: 0.75; margin-bottom: 2rem; }
    #qrcode { background: white; padding: 12px; border-radius: 16px; box-shadow: 0 0 50px rgba(255,255,255,0.15); }
    #conn-info { margin-top: 1.2rem; font-size: 0.82rem; opacity: 0.45; letter-spacing: 1px; }
    #version { position: fixed; bottom: 10px; left: 14px; font-size: 0.75rem; opacity: 0.35; color: white; z-index: 200; letter-spacing: 1px; }

    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: center;
      padding: 18px; pointer-events: none; z-index: 10;
    }
    #score-box {
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
      border-radius: 40px; padding: 10px 30px;
      font-size: 1.9rem; font-weight: bold;
      color: white;
      display: flex; flex-direction: row; align-items: center; gap: 0.5rem;
    }
    #timer-box {
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
      border-radius: 40px; padding: 10px 30px;
      font-size: 1.9rem; font-weight: bold;
      color: #ffffff; margin-left: 18px;
      transition: color 0.3s;
    }

    #end-overlay {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0, 20, 60, 0.92);
      color: white; z-index: 110; gap: 0.6rem;
    }
    #end-overlay h2 { font-size: 2.4rem; letter-spacing: 2px; margin-bottom: 0.4rem; }
    #end-overlay .sub { font-size: 1.1rem; opacity: 0.7; }
    #end-score { font-size: 4.5rem; font-weight: bold; color: #ffd700; text-shadow: 0 0 24px rgba(255,215,0,0.55); line-height: 1.1; }
    #btn-restart {
      margin-top: 1.4rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; border: none;
      padding: 16px 44px; border-radius: 50px;
      font-size: 1.15rem; cursor: pointer;
      box-shadow: 0 4px 22px rgba(102,126,234,0.45);
      transition: transform .1s;
    }
    #btn-restart:active { transform: scale(0.95); }

    #status-pill {
      position: fixed; bottom: 22px; right: 22px;
      background: rgba(0,0,0,0.5); color: white;
      border-radius: 30px; padding: 8px 18px;
      font-size: 0.85rem; z-index: 10;
      backdrop-filter: blur(4px);
    }
    .pill-ok    { background: rgba(0,170,60,0.65)   !important; }
    .pill-err   { background: rgba(180,30,30,0.65)  !important; }
    .pill-calib { background: rgba(220,140,0,0.75)  !important; }

    #calib-wait {
      position: fixed; inset: 0;
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0, 10, 40, 0.72);
      color: white; z-index: 20;
      gap: 1rem; pointer-events: none;
    }
    #calib-wait-spinner {
      width: 50px; height: 50px;
      border: 4px solid rgba(255,255,255,0.18);
      border-top-color: #ffd700;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #calib-wait p {
      font-size: 1.15rem; opacity: 0.88;
      text-align: center; line-height: 1.6;
    }

    #lightning-flash {
      position: fixed; inset: 0;
      background: rgba(240, 250, 255, 0.95);
      pointer-events: none; z-index: 50;
      opacity: 0; transition: opacity 0.48s ease-out;
    }

    #hit-label {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.4rem; font-weight: bold;
      color: #ff4444; text-shadow: 0 0 18px rgba(255,60,60,0.7);
      pointer-events: none; z-index: 51;
      opacity: 0; transition: opacity 0.5s ease-out;
    }

    #score-box2 {
      background: rgba(0,0,0,0.45); backdrop-filter: blur(8px);
      border-radius: 40px; padding: 10px 30px;
      font-size: 1.9rem; font-weight: bold;
      color: white; margin-left: 18px;
      display: flex; flex-direction: row; align-items: center; gap: 0.5rem;
    }
    .player-label {
      display: none; font-size: inherit; font-weight: bold; opacity: 0.55;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h1>✈️ SkyCoins</h1>
    <p class="sub">Scanne den QR-Code mit deinem Handy</p>
    <div id="qrcode"></div>
    <div id="conn-info">Verbindungs-ID wird geladen…</div>
  </div>

  <div id="hud" style="display:none">
    <div id="score-box">
      <div class="player-label" id="label1">SPIELER 1</div>
      <img src="Coin_JLS.png" style="height:1.4em; vertical-align:middle;"> <span id="score-val">0</span>
    </div>
    <div id="timer-box">⏱ <span id="timer-val">60</span>s</div>
    <div id="score-box2" style="display:none">
      <div class="player-label" id="label2" style="display:block">SPIELER 2</div>
      <img src="Coin_JLS.png" style="height:1.4em; vertical-align:middle;"> <span id="score-val2">0</span>
    </div>
  </div>

  <div id="split-line" style="display:none; pointer-events:none; z-index:5;"></div>

  <div id="end-overlay">
    <h2>⏱ Zeit abgelaufen!</h2>
    <p class="sub" id="end-sub">Dein Score</p>
    <div id="end-score" style="display:flex; align-items:center; gap:0.4em;">
      <img src="Coin_JLS.png" style="height:1em; vertical-align:middle;">
      <span id="end-score-val">0</span>
    </div>
    <div id="end-scores-duo" style="display:none; flex-direction:column; align-items:center; gap:0.4rem;">
      <div id="end-winner" style="font-size:1.6rem; font-weight:bold;"></div>
      <div style="display:flex; gap:2rem; font-size:1.3rem; margin-top:0.4rem;">
        <div style="color:#88aaff;"><img src="Coin_JLS.png" style="height:1em; vertical-align:middle;"> <span id="end-score1">0</span></div>
        <div style="color:#ff6644;"><img src="Coin_JLS.png" style="height:1em; vertical-align:middle;"> <span id="end-score2">0</span></div>
      </div>
    </div>
    <button id="btn-restart">🔄 Nochmal spielen</button>
  </div>
  <div id="status-pill">Warte auf Controller…</div>
  <div id="version">v5.0</div>

  <div id="calib-wait">
    <div id="calib-wait-spinner"></div>
    <p>Controller wird kalibriert…<br><span style="font-size:0.85rem;opacity:0.6">Spiel startet gleich</span></p>
  </div>

  <div id="lightning-flash"></div>
  <div id="hit-label">⚡ −5</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { Line2 } from 'three/addons/lines/Line2.js';
  import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
  import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

  // ── SCENE ──────────────────────────────────────────────────────────────────
  const scene    = new THREE.Scene();
  scene.fog      = new THREE.FogExp2(0x9dcef5, 0.007);

  const camera   = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 600);
  camera.position.set(0, 5, 14);
  camera.lookAt(0, 1, 0);

  const camera2  = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 600);
  camera2.position.set(3, 5, 14);
  camera2.lookAt(3, 1, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const sun = new THREE.DirectionalLight(0xfff0cc, 1.3);
  sun.position.set(40, 80, -30);
  scene.add(sun);

  // Sky sphere with shader gradient
  const skyGeo = new THREE.SphereGeometry(450, 16, 8);
  const skyMat = new THREE.ShaderMaterial({
    uniforms: {
      topColor:    { value: new THREE.Color(0x1466cc) },
      bottomColor: { value: new THREE.Color(0x8ec8f6) }
    },
    vertexShader:   `varying float vY; void main(){ vY = position.y; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `varying float vY; uniform vec3 topColor,bottomColor; void main(){ gl_FragColor=vec4(mix(bottomColor,topColor,smoothstep(-80.,280.,vY)),1.); }`,
    side: THREE.BackSide
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  // ── AIRPLANE ───────────────────────────────────────────────────────────────
  const PLANE_TEXTURES = ['Plane_Blau.png', 'Plane_Gruen.png'];

  let propeller = null, propeller2 = null;
  const airplane  = new THREE.Group();
  const airplane2 = new THREE.Group();
  airplane2.visible = false;
  scene.add(airplane);
  scene.add(airplane2);

  let glbReady = false, pendingTexMode = null;
  const texLoader = new THREE.TextureLoader();

  function applyTexture(group, name) {
    texLoader.load(name, tex => {
      tex.flipY = false;
      tex.colorSpace = THREE.SRGBColorSpace;
      group.traverse(child => {
        if (child.isMesh) {
          child.material = child.material.clone();
          child.material.map = tex;
          child.material.color.set(0xffffff);
          child.material.metalness = 0.0;
          child.material.roughness = 0.75;
          child.material.needsUpdate = true;
        }
      });
    }, undefined, err => console.warn('Textur Ladefehler:', name, err));
  }

  function assignTextures(mode) {
    const shuffled = [...PLANE_TEXTURES].sort(() => Math.random() - 0.5);
    applyTexture(airplane,  shuffled[0]);
    if (mode === 'duo') applyTexture(airplane2, shuffled[1 % shuffled.length]);
  }

  new GLTFLoader().load('Plane.glb', gltf => {
    const model = gltf.scene;
    propeller = model.getObjectByName('Propeller');
    airplane.add(model);
    const model2 = gltf.scene.clone(true);
    propeller2 = model2.getObjectByName('Propeller');
    airplane2.add(model2);
    glbReady = true;
    if (pendingTexMode !== null) assignTextures(pendingTexMode);
  }, undefined, err => console.error('GLB Ladefehler:', err));

  // ── CLOUDS & COINS ─────────────────────────────────────────────────────────
  const clouds = [], coins = [];
  let cloudTemplates = [], coinTemplate = null;


  new GLTFLoader().load('Cloud.glb', gltf => {
    gltf.scene.traverse(obj => {
      if (obj.name.startsWith('Cloud_')) cloudTemplates.push(obj);
    });
    if (!cloudTemplates.length) cloudTemplates = [gltf.scene];
    for (let i = 0; i < 22; i++) spawnCloud(-20 - i * 9);
  }, undefined, err => console.error('Cloud GLB Ladefehler:', err));

  new GLTFLoader().load('Coin.glb', gltf => {
    coinTemplate = gltf.scene;
    for (let i = 0; i < 14; i++) spawnCoin(-18 - i * 14);
  }, undefined, err => console.error('Coin GLB Ladefehler:', err));

  function spawnCloud(z) {
    if (!cloudTemplates.length) return;
    const template = cloudTemplates[Math.floor(Math.random() * cloudTemplates.length)];
    const cloud = template.clone(true);
    cloud.traverse(child => {
      if (child.isMesh) {
        child.material = child.material.clone();
        child.material.transparent = true;
        child.material.opacity = 0.88;
        child.material.depthWrite = false;
        child.material.side = THREE.DoubleSide;
        child.material.metalness = 0.0;
        child.material.roughness = 1.0;
        child.material.needsUpdate = true;
        child.renderOrder = 1;
      }
    });
    const scale = 0.7 + Math.random() * 2.3;
    cloud.scale.setScalar(scale);
    cloud.rotation.y = Math.random() * Math.PI * 2;
    cloud.position.set((Math.random() - .5) * 54, -2 + Math.random() * 14, z);
    cloud.userData.speed = 0.55 + Math.random() * 0.15;
    scene.add(cloud);
    clouds.push(cloud);
  }

  function spawnCoin(z) {
    if (!coinTemplate) return;
    const coin = coinTemplate.clone();
    coin.position.set((Math.random() - .5) * 18, -3.5 + Math.random() * 8, z);
    coin.userData.rotX = 0;
    coin.userData.rotY = 1.5 + Math.random() * 2.5;
    coin.userData.rotZ = 0;
    scene.add(coin);
    coins.push(coin);
  }
  // Clouds & Coins werden in den GLB-Loader-Callbacks gespawnt

  // ── GAME STATE ─────────────────────────────────────────────────────────────
  let score = 0, gameRunning = false, gameOver = false;
  let timeLeft = 60;
  let tiltX = 0, tiltY = 0;
  let planeX = 0, planeY = 0;
  let spawnTimer = 0;
  const lightnings = [];
  const lineMaterials = [];
  let lightningTimer = 0;
  let lightningInterval = 2 + Math.random() * 5;

  let gameMode = 'solo';
  let conn2 = null;
  let tiltX2 = 0, tiltY2 = 0;
  let planeX2 = 6, planeY2 = 0;
  let score2 = 0;
  let calibrated1 = false, calibrated2 = false;
  let connectedCount = 0;

  const scoreEl  = document.getElementById('score-val');
  const scoreEl2 = document.getElementById('score-val2');
  const timerEl  = document.getElementById('timer-val');

  // ── PEERJS ─────────────────────────────────────────────────────────────────
  const peer = new Peer(undefined, { debug: 0 });
  let conn = null;

  peer.on('open', id => {
    const base = location.href.replace(/[^/]*$/, '');
    const url  = base + 'controller.html?peer=' + id;
    new QRCode(document.getElementById('qrcode'), { text: url, width: 220, height: 220 });
    document.getElementById('conn-info').textContent = 'ID: ' + id;
  });

  peer.on('connection', c => {
    connectedCount++;
    const isP1 = connectedCount === 1;
    if (isP1) conn = c; else conn2 = c;

    const playerNum = connectedCount;
    c.on('open', () => {
      c.send({ type: 'playerAssigned', player: playerNum });
    });

    if (connectedCount === 1) {
      document.getElementById('hud').style.display = 'flex';
    }
    if (connectedCount === 2) {
      document.getElementById('overlay').style.display = 'none';
    }

    const pill      = document.getElementById('status-pill');
    const calibWait = document.getElementById('calib-wait');
    pill.textContent = '⏳ Kalibrierung…';
    pill.className   = 'pill-calib';
    calibWait.style.display = 'flex';
    gameRunning = false;

    c.on('data', d => {
      if (d.type === 'gameMode') {
        gameMode = d.value;
        if (glbReady) assignTextures(d.value); else pendingTexMode = d.value;
        if (d.value === 'solo') {
          document.getElementById('overlay').style.display = 'none';
        } else if (d.value === 'duo') {
          document.querySelector('#overlay .sub').textContent = 'Spieler 2: Scanne zum Beitreten';
          document.getElementById('label1').style.display = 'block';
          document.getElementById('score-box2').style.display = 'flex';
          airplane2.visible = true;
          planeX = -6; airplane.position.x = -6;
          planeX2 = 6;  airplane2.position.x = 6;
          updateSplitLayout();
        }
      }
      if (d.type === 'calibrated') {
        if (isP1) calibrated1 = true; else calibrated2 = true;
        const ready = gameMode === 'solo' ? calibrated1 : (calibrated1 && calibrated2);
        if (ready) {
          calibWait.style.display = 'none';
          gameRunning = true;
          pill.textContent = '🎮 Verbunden';
          pill.className   = 'pill-ok';
          if (conn  && conn.open)  conn.send({ type: 'sound', name: 'propStart' });
          if (conn2 && conn2.open) conn2.send({ type: 'sound', name: 'propStart' });
        }
      }
      if (d.type === 'tilt') {
        const gx = Math.max(-30, Math.min(30, d.gamma));
        const gy = Math.max(-30, Math.min(30, d.beta));
        if (isP1) { tiltX = gx; tiltY = gy; }
        else       { tiltX2 = gx; tiltY2 = gy; }
      }
    });
    c.on('close', () => {
      gameRunning = false;
      calibWait.style.display = 'none';
      pill.textContent = '❌ Verbindung verloren';
      pill.className   = 'pill-err';
    });
  });

  // ── LIGHTNING ──────────────────────────────────────────────────────────────
  function spawnLightning() {
    const candidates = clouds.filter(c => c.position.z > -70 && c.position.z < -8);
    if (!candidates.length) return;
    const cloud = candidates[Math.floor(Math.random() * candidates.length)];

    const bx = cloud.position.x + (Math.random() - 0.5) * 3;
    const by = cloud.position.y - 1.5;
    const bz = cloud.position.z;

    const pts = [];
    let lx = 0, ly = 0;
    pts.push(new THREE.Vector3(0, 0, 0));
    const segments = 10 + Math.floor(Math.random() * 6);
    for (let i = 0; i < segments; i++) {
      lx += (Math.random() - 0.5) * 3.2;
      ly -= 2.0 + Math.random() * 1.5;
      pts.push(new THREE.Vector3(lx, ly, 0));
    }

    const positions = [];
    pts.forEach(p => positions.push(p.x, p.y, p.z));

    const res = new THREE.Vector2(innerWidth, innerHeight);

    const boltGeo = new LineGeometry();
    boltGeo.setPositions(positions);
    const boltMat = new LineMaterial({ color: 0xffffff, linewidth: 3, transparent: true, opacity: 1, resolution: res });

    const glowGeo2 = new LineGeometry();
    glowGeo2.setPositions(positions);
    const glowMat = new LineMaterial({ color: 0x88ccff, linewidth: 7, transparent: true, opacity: 0.35, resolution: res.clone() });

    const bolt = new Line2(boltGeo, boltMat);
    const glow = new Line2(glowGeo2, glowMat);
    bolt.position.set(bx, by, bz);
    glow.position.set(bx, by, bz);

    bolt.userData.age     = 0;
    bolt.userData.life    = 1.0 + Math.random() * 0.6;
    bolt.userData.dropY   = ly;
    bolt.userData.hit     = false;
    bolt.userData.hit2    = false;
    bolt.userData.glow    = glow;

    lineMaterials.push(boltMat, glowMat);
    scene.add(glow);
    scene.add(bolt);
    lightnings.push(bolt);
  }

  // ── GAME LOOP ──────────────────────────────────────────────────────────────
  const clock = new THREE.Clock();
  const SPEED = 28;

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    if (gameRunning) {
      const velX =  (tiltX / 30) * 13;
      const velY = -(tiltY / 30) * 13;

      planeX += velX * dt;
      planeY += velY * dt;
      planeX  = Math.max(-14, Math.min(14, planeX));
      planeY  = Math.max(-6,  Math.min(16, planeY));

      airplane.position.x = planeX;
      airplane.position.y = planeY;

      // Bank & pitch basiert direkt auf Neigungswinkel
      const desiredRoll  = -(tiltX / 30) * 0.45;
      const desiredPitch = -(tiltY / 30) * 0.30;
      airplane.rotation.z += (desiredRoll  - airplane.rotation.z) * 5 * dt;
      airplane.rotation.x += (desiredPitch - airplane.rotation.x) * 5 * dt;

      // Spin propeller
      if (propeller) propeller.rotation.z += 18 * dt;

      // Camera1 follow
      camera.position.x += (planeX     - camera.position.x) * 4 * dt;
      camera.position.y += (planeY + 5 - camera.position.y) * 4 * dt;
      camera.lookAt(planeX, planeY, -8);

      // Airplane2 + Camera2 (duo only)
      if (gameMode === 'duo') {
        const velX2 =  (tiltX2 / 30) * 13;
        const velY2 = -(tiltY2 / 30) * 13;
        planeX2 += velX2 * dt;
        planeY2 += velY2 * dt;
        planeX2 = Math.max(-14, Math.min(14, planeX2));
        planeY2 = Math.max(-6,  Math.min(16, planeY2));
        airplane2.position.x = planeX2;
        airplane2.position.y = planeY2;
        airplane2.rotation.z += (-(tiltX2/30)*0.45 - airplane2.rotation.z) * 5 * dt;
        airplane2.rotation.x += (-(tiltY2/30)*0.30 - airplane2.rotation.x) * 5 * dt;
        if (propeller2) propeller2.rotation.z += 18 * dt;
        camera2.position.x += (planeX2     - camera2.position.x) * 4 * dt;
        camera2.position.y += (planeY2 + 5 - camera2.position.y) * 4 * dt;
        camera2.lookAt(planeX2, planeY2, -8);

        // Plane-plane separation
        const sepX = planeX2 - planeX;
        const sepY = planeY2 - planeY;
        const dist = Math.sqrt(sepX * sepX + sepY * sepY);
        const MIN_SEP = 3.5;
        if (dist < MIN_SEP && dist > 0.001) {
          const push = (MIN_SEP - dist) * 0.5;
          const nx = sepX / dist, ny = sepY / dist;
          planeX  -= nx * push; planeY  -= ny * push;
          planeX2 += nx * push; planeY2 += ny * push;
          planeX  = Math.max(-14, Math.min(14, planeX));
          planeY  = Math.max(-6,  Math.min(16, planeY));
          planeX2 = Math.max(-14, Math.min(14, planeX2));
          planeY2 = Math.max(-6,  Math.min(16, planeY2));
          airplane.position.x  = planeX;  airplane.position.y  = planeY;
          airplane2.position.x = planeX2; airplane2.position.y = planeY2;
        }
      }

      // Spawn timer
      spawnTimer += dt;
      if (spawnTimer > 1.1) {
        spawnTimer = 0;
        spawnCloud(-210);
        spawnCoin(-185);
        if (Math.random() < 0.5) spawnCoin(-185);
      }

      // Countdown timer
      timeLeft -= dt;
      const secsLeft = Math.ceil(timeLeft);
      timerEl.textContent = secsLeft;
      timerEl.parentElement.style.color = secsLeft <= 10 ? '#ff4444' : '#ffffff';
      if (timeLeft <= 0) { endGame(); return; }

      // Lightning spawn (random interval 2–7s, 30% chance of double strike)
      lightningTimer += dt;
      if (lightningTimer > lightningInterval) {
        lightningTimer = 0;
        lightningInterval = 2 + Math.random() * 5;
        const count = Math.random() < 0.3 ? 2 : 1;
        for (let b = 0; b < count; b++) spawnLightning();
      }

      // Update lightning bolts
      for (let i = lightnings.length - 1; i >= 0; i--) {
        const bolt = lightnings[i];
        bolt.userData.age += dt;
        bolt.position.z += SPEED * dt;
        if (bolt.userData.glow) bolt.userData.glow.position.z = bolt.position.z;

        // Flicker at ~20 Hz
        const flickerOn = Math.floor(bolt.userData.age * 20) % 2 === 0;
        bolt.material.opacity = flickerOn ? 1.0 : 0.1;
        if (bolt.userData.glow) bolt.userData.glow.material.opacity = flickerOn ? 0.35 : 0.0;

        // Collision when bolt passes through plane's z-plane
        if (!bolt.userData.hit && Math.abs(bolt.position.z) < 3) {
          const dx = Math.abs(bolt.position.x - planeX);
          const dy = bolt.position.y - planeY;
          if (dx < 4.5 && dy > -2 && dy < Math.abs(bolt.userData.dropY) + 2) {
            bolt.userData.hit = true;
            score = Math.max(0, score - 5);
            scoreEl.textContent = score;
            if (conn && conn.open) { conn.send({ type: 'score', value: score }); conn.send({ type: 'sound', name: 'lightning' }); }
            const flash    = document.getElementById('lightning-flash');
            const hitLabel = document.getElementById('hit-label');
            flash.style.opacity    = '1';
            hitLabel.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; hitLabel.style.opacity = '0'; }, 480);
          }
        }
        if (gameMode === 'duo' && !bolt.userData.hit2 && Math.abs(bolt.position.z) < 3) {
          const dx2 = Math.abs(bolt.position.x - planeX2);
          const dy2 = bolt.position.y - planeY2;
          if (dx2 < 4.5 && dy2 > -2 && dy2 < Math.abs(bolt.userData.dropY) + 2) {
            bolt.userData.hit2 = true;
            score2 = Math.max(0, score2 - 5);
            scoreEl2.textContent = score2;
            if (conn2 && conn2.open) { conn2.send({ type: 'score', value: score2 }); conn2.send({ type: 'sound', name: 'lightning' }); }
            document.getElementById('lightning-flash').style.opacity = '1';
            document.getElementById('hit-label').style.opacity = '1';
            setTimeout(() => { document.getElementById('lightning-flash').style.opacity='0'; document.getElementById('hit-label').style.opacity='0'; }, 480);
          }
        }

        if (bolt.userData.age > bolt.userData.life || bolt.position.z > 22) {
          if (bolt.userData.glow) {
            scene.remove(bolt.userData.glow);
            bolt.userData.glow.geometry.dispose();
            const gi = lineMaterials.indexOf(bolt.userData.glow.material);
            if (gi !== -1) { bolt.userData.glow.material.dispose(); lineMaterials.splice(gi, 1); }
          }
          scene.remove(bolt);
          bolt.geometry.dispose();
          const bi = lineMaterials.indexOf(bolt.material);
          if (bi !== -1) { bolt.material.dispose(); lineMaterials.splice(bi, 1); }
          lightnings.splice(i, 1);
        }
      }

      // Move clouds
      for (let i = clouds.length - 1; i >= 0; i--) {
        clouds[i].position.z += SPEED * clouds[i].userData.speed * dt;
        if (clouds[i].position.z > 22) { scene.remove(clouds[i]); clouds.splice(i, 1); }
      }

      // Move coins + collision
      for (let i = coins.length - 1; i >= 0; i--) {
        const c  = coins[i];
        c.position.z += SPEED * dt;
        c.rotation.x += c.userData.rotX * dt;
        c.rotation.y += c.userData.rotY * dt;
        c.rotation.z += c.userData.rotZ * dt;

        let removed = false;
        const dx = c.position.x - planeX;
        const dy = c.position.y - planeY;
        const dz = c.position.z - airplane.position.z;
        if (Math.sqrt(dx*dx + dy*dy + dz*dz) < 4.0) {
          score++; scoreEl.textContent = score;
          if (conn && conn.open) { conn.send({ type: 'score', value: score }); conn.send({ type: 'sound', name: 'bling' }); }
          scene.remove(c); coins.splice(i, 1);
          removed = true;
        }
        if (!removed && gameMode === 'duo') {
          const dx2 = c.position.x - planeX2;
          const dy2 = c.position.y - planeY2;
          const dz2 = c.position.z - airplane2.position.z;
          if (Math.sqrt(dx2*dx2 + dy2*dy2 + dz2*dz2) < 4.0) {
            score2++; scoreEl2.textContent = score2;
            if (conn2 && conn2.open) { conn2.send({ type: 'score', value: score2 }); conn2.send({ type: 'sound', name: 'bling' }); }
            scene.remove(c); coins.splice(i, 1);
            removed = true;
          }
        }
        if (!removed && c.position.z > 22) {
          scene.remove(c); coins.splice(i, 1);
        }
      }
    }

    if (gameMode === 'duo') {
      const W = innerWidth, H = innerHeight;
      const portrait = H > W;
      renderer.setScissorTest(true);
      if (portrait) {
        const half = Math.floor(H / 2);
        camera.aspect = W / half; camera.updateProjectionMatrix();
        renderer.setViewport(0, half, W, half); renderer.setScissor(0, half, W, half);
        renderer.render(scene, camera);
        camera2.aspect = W / half; camera2.updateProjectionMatrix();
        renderer.setViewport(0, 0, W, half); renderer.setScissor(0, 0, W, half);
        renderer.render(scene, camera2);
      } else {
        const half = Math.floor(W / 2);
        camera.aspect = half / H; camera.updateProjectionMatrix();
        renderer.setViewport(0, 0, half, H); renderer.setScissor(0, 0, half, H);
        renderer.render(scene, camera);
        camera2.aspect = half / H; camera2.updateProjectionMatrix();
        renderer.setViewport(half, 0, half, H); renderer.setScissor(half, 0, half, H);
        renderer.render(scene, camera2);
      }
      renderer.setScissorTest(false);
      renderer.setViewport(0, 0, W, H);
    } else {
      renderer.render(scene, camera);
    }
  }

  function endGame() {
    gameRunning = false;
    gameOver = true;
    if (conn  && conn.open)  conn.send({ type: 'sound', name: 'propStop' });
    if (conn2 && conn2.open) conn2.send({ type: 'sound', name: 'propStop' });
    if (gameMode === 'duo') {
      document.getElementById('end-score').style.display = 'none';
      document.getElementById('end-sub').style.display = 'none';
      document.getElementById('end-scores-duo').style.display = 'flex';
      document.getElementById('end-score1').textContent = score;
      document.getElementById('end-score2').textContent = score2;
      document.getElementById('end-winner').textContent =
        score > score2 ? '✈️ Spieler 1 gewinnt!' : score2 > score ? '✈️ Spieler 2 gewinnt!' : '🤝 Unentschieden!';
      if (conn && conn.open) conn.send({ type: 'gameover', score });
      if (conn2 && conn2.open) conn2.send({ type: 'gameover', score: score2 });
    } else {
      document.getElementById('end-score-val').textContent = score;
      if (conn && conn.open) conn.send({ type: 'gameover', score });
    }
    document.getElementById('end-overlay').style.display = 'flex';
  }

  function restartGame() {
    score = 0; timeLeft = 60; gameOver = false;
    planeX = gameMode === 'duo' ? -6 : 0; planeY = 0;
    assignTextures(gameMode);
    scoreEl.textContent = 0;
    timerEl.textContent = 60;
    timerEl.parentElement.style.color = '#ffffff';
    if (conn  && conn.open)  conn.send({ type: 'sound', name: 'propStart' });
    if (conn2 && conn2.open) conn2.send({ type: 'sound', name: 'propStart' });
    if (gameMode === 'duo') {
      score2 = 0; planeX2 = 6; planeY2 = 0;
      scoreEl2.textContent = 0;
      document.getElementById('end-score').style.display = '';
      document.getElementById('end-sub').style.display = '';
      document.getElementById('end-scores-duo').style.display = 'none';
    }

    [...coins].forEach(o => scene.remove(o));
    [...clouds].forEach(o => scene.remove(o));
    [...lightnings].forEach(o => {
      if (o.userData.glow) scene.remove(o.userData.glow);
      scene.remove(o);
    });
    coins.length = 0; clouds.length = 0; lightnings.length = 0;

    for (let i = 0; i < 22; i++) spawnCloud(-20 - i * 9);
    for (let i = 0; i < 14; i++) spawnCoin(-18 - i * 14);

    document.getElementById('end-overlay').style.display = 'none';
    gameRunning = true;
  }

  document.getElementById('btn-restart').addEventListener('click', restartGame);

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    camera2.aspect = innerWidth / innerHeight;
    camera2.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    lineMaterials.forEach(m => m.resolution.set(innerWidth, innerHeight));
    updateSplitLayout();
  });

  function updateSplitLayout() {
    if (gameMode !== 'duo') return;
    const line = document.getElementById('split-line');
    const isPortrait = innerHeight > innerWidth;
    if (isPortrait) {
      line.style.cssText = 'display:block; position:fixed; left:0; top:50%; width:100%; height:2px; background:rgba(255,255,255,0.25); z-index:5; pointer-events:none;';
      const sb2 = document.getElementById('score-box2');
      sb2.style.position = 'fixed';
      sb2.style.bottom = '12px';
      sb2.style.top = 'auto';
      sb2.style.marginLeft = '0';
      sb2.style.left = '18px';
    } else {
      line.style.cssText = 'display:block; position:fixed; top:0; left:50%; width:2px; height:100%; background:rgba(255,255,255,0.25); z-index:5; pointer-events:none;';
      const sb2 = document.getElementById('score-box2');
      sb2.style.position = '';
      sb2.style.bottom = '';
      sb2.style.top = '';
      sb2.style.marginLeft = '18px';
      sb2.style.left = '';
    }
  }

  </script>
</body>
</html>
