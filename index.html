<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyCoins</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }

    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0, 20, 60, 0.88);
      color: white; z-index: 100;
    }
    #overlay h1 { font-size: 3.5rem; margin-bottom: 0.4rem; letter-spacing: 3px; }
    #overlay .sub { font-size: 1.1rem; opacity: 0.75; margin-bottom: 2rem; }
    #qrcode { background: white; padding: 12px; border-radius: 16px; box-shadow: 0 0 50px rgba(255,255,255,0.15); }
    #conn-info { margin-top: 1.2rem; font-size: 0.82rem; opacity: 0.45; letter-spacing: 1px; }

    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: center;
      padding: 18px; pointer-events: none; z-index: 10;
    }
    #score-box {
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
      border-radius: 40px; padding: 10px 30px;
      font-size: 1.9rem; font-weight: bold;
      color: #ffd700; text-shadow: 0 0 12px rgba(255,215,0,0.6);
    }

    #status-pill {
      position: fixed; bottom: 22px; right: 22px;
      background: rgba(0,0,0,0.5); color: white;
      border-radius: 30px; padding: 8px 18px;
      font-size: 0.85rem; z-index: 10;
      backdrop-filter: blur(4px);
    }
    .pill-ok    { background: rgba(0,170,60,0.65)   !important; }
    .pill-err   { background: rgba(180,30,30,0.65)  !important; }
    .pill-calib { background: rgba(220,140,0,0.75)  !important; }

    #calib-wait {
      position: fixed; inset: 0;
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0, 10, 40, 0.72);
      color: white; z-index: 20;
      gap: 1rem; pointer-events: none;
    }
    #calib-wait-spinner {
      width: 50px; height: 50px;
      border: 4px solid rgba(255,255,255,0.18);
      border-top-color: #ffd700;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #calib-wait p {
      font-size: 1.15rem; opacity: 0.88;
      text-align: center; line-height: 1.6;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h1>✈️ SkyCoins</h1>
    <p class="sub">Scanne den QR-Code mit deinem Handy</p>
    <div id="qrcode"></div>
    <div id="conn-info">Verbindungs-ID wird geladen…</div>
  </div>

  <div id="hud" style="display:none">
    <div id="score-box">🪙 <span id="score-val">0</span></div>
  </div>
  <div id="status-pill">Warte auf Controller…</div>

  <div id="calib-wait">
    <div id="calib-wait-spinner"></div>
    <p>Controller wird kalibriert…<br><span style="font-size:0.85rem;opacity:0.6">Spiel startet gleich</span></p>
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>

  // ── SCENE ──────────────────────────────────────────────────────────────────
  const scene    = new THREE.Scene();
  scene.fog      = new THREE.FogExp2(0x9dcef5, 0.007);

  const camera   = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 600);
  camera.position.set(0, 5, 14);
  camera.lookAt(0, 1, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const sun = new THREE.DirectionalLight(0xfff0cc, 1.3);
  sun.position.set(40, 80, -30);
  scene.add(sun);

  // Sky sphere with shader gradient
  const skyGeo = new THREE.SphereGeometry(450, 16, 8);
  const skyMat = new THREE.ShaderMaterial({
    uniforms: {
      topColor:    { value: new THREE.Color(0x1466cc) },
      bottomColor: { value: new THREE.Color(0x8ec8f6) }
    },
    vertexShader:   `varying float vY; void main(){ vY = position.y; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `varying float vY; uniform vec3 topColor,bottomColor; void main(){ gl_FragColor=vec4(mix(bottomColor,topColor,smoothstep(-80.,280.,vY)),1.); }`,
    side: THREE.BackSide
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  // ── AIRPLANE ───────────────────────────────────────────────────────────────
  let propeller = null;

  function buildPlane() {
    const g       = new THREE.Group();
    const blue     = new THREE.MeshPhongMaterial({ color: 0x1a4fc4 });
    const lightBlu = new THREE.MeshPhongMaterial({ color: 0x4477dd });
    const white    = new THREE.MeshPhongMaterial({ color: 0xddeeff });
    const red      = new THREE.MeshPhongMaterial({ color: 0xcc1111 });
    const dark     = new THREE.MeshPhongMaterial({ color: 0x222233 });
    const glass    = new THREE.MeshPhongMaterial({ color: 0x88ccff, transparent: true, opacity: 0.55, shininess: 200 });

    // Fuselage — nose points toward -Z
    const fus = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.22, 3.6, 10), blue);
    fus.rotation.x = Math.PI / 2;
    g.add(fus);

    // Nose cone
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.38, 1.4, 10), white);
    nose.rotation.x = -Math.PI / 2;
    nose.position.z = -2.5;
    g.add(nose);

    // Main wings
    const wings = new THREE.Mesh(new THREE.BoxGeometry(7.6, 0.12, 1.5), lightBlu);
    wings.position.set(0, -0.04, 0.2);
    g.add(wings);

    // Horizontal stabilizer
    const hs = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.1, 0.9), blue);
    hs.position.set(0, 0, 1.55);
    g.add(hs);

    // Vertical stabilizer
    const vs = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.1, 0.9), red);
    vs.position.set(0, 0.55, 1.55);
    g.add(vs);

    // Cockpit bubble
    const ck = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 6, 0, Math.PI * 2, 0, Math.PI / 1.8), glass);
    ck.position.set(0, 0.33, -0.9);
    g.add(ck);

    // Propeller group (kept separate so we can spin it)
    propeller = new THREE.Group();
    propeller.position.z = -3.05;

    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.28, 8), red);
    hub.rotation.x = Math.PI / 2;
    propeller.add(hub);

    for (let i = 0; i < 3; i++) {
      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.11, 1.9, 0.07), dark);
      blade.rotation.z = (i * Math.PI * 2) / 3;
      propeller.add(blade);
    }
    g.add(propeller);

    return g;
  }

  const airplane = buildPlane();
  scene.add(airplane);

  // ── CLOUDS & COINS ─────────────────────────────────────────────────────────
  const clouds = [], coins = [];

  function spawnCloud(z) {
    const g   = new THREE.Group();
    const mat = new THREE.MeshPhongMaterial({ color: 0xfafafa, transparent: true, opacity: 0.9 });
    for (let i = 0; i < 5 + Math.floor(Math.random() * 5); i++) {
      const r    = 1.4 + Math.random() * 2.6;
      const puff = new THREE.Mesh(new THREE.SphereGeometry(r, 7, 6), mat.clone());
      puff.position.set((Math.random() - .5) * 7, (Math.random() - .5) * 2.5, (Math.random() - .5) * 4);
      g.add(puff);
    }
    g.position.set((Math.random() - .5) * 54, -2 + Math.random() * 14, z);
    g.userData.speed = 0.55 + Math.random() * 0.15;
    scene.add(g);
    clouds.push(g);
  }

  function spawnCoin(z) {
    const coin = new THREE.Mesh(
      new THREE.TorusGeometry(0.55, 0.18, 10, 22),
      new THREE.MeshPhongMaterial({ color: 0xffd700, emissive: 0xaa7700, shininess: 130 })
    );
    coin.position.set((Math.random() - .5) * 18, -3.5 + Math.random() * 8, z);
    coin.rotation.y = Math.PI / 2;
    coin.userData.speed = 1;
    scene.add(coin);
    coins.push(coin);
  }

  // Pre-populate scene
  for (let i = 0; i < 22; i++) spawnCloud(-20 - i * 9);
  for (let i = 0; i < 14; i++) spawnCoin(-18 - i * 14);

  // ── GAME STATE ─────────────────────────────────────────────────────────────
  let score = 0, gameRunning = false;
  let tiltX = 0, tiltY = 0;
  let planeX = 0, planeY = 0;
  let spawnTimer = 0;

  const scoreEl = document.getElementById('score-val');

  // ── PEERJS ─────────────────────────────────────────────────────────────────
  const peer = new Peer(undefined, { debug: 0 });
  let conn = null;

  peer.on('open', id => {
    const base = location.href.replace(/[^/]*$/, '');
    const url  = base + 'controller.html?peer=' + id;
    new QRCode(document.getElementById('qrcode'), { text: url, width: 220, height: 220 });
    document.getElementById('conn-info').textContent = 'ID: ' + id;
  });

  peer.on('connection', c => {
    conn = c;
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('hud').style.display      = 'flex';

    const pill      = document.getElementById('status-pill');
    const calibWait = document.getElementById('calib-wait');

    // Wait for calibration — do NOT start game yet
    pill.textContent = '⏳ Kalibrierung…';
    pill.className   = 'pill-calib';
    calibWait.style.display = 'flex';
    gameRunning = false;

    c.on('data', d => {
      if (d.type === 'calibrated') {
        calibWait.style.display = 'none';
        gameRunning = true;
        pill.textContent = '🎮 Verbunden';
        pill.className   = 'pill-ok';
      }
      if (d.type === 'tilt') {
        tiltX = Math.max(-45, Math.min(45, d.gamma));
        tiltY = Math.max(-45, Math.min(45, d.beta));
      }
    });
    c.on('close', () => {
      gameRunning = false;
      calibWait.style.display = 'none';
      pill.textContent = '❌ Verbindung verloren';
      pill.className   = 'pill-err';
    });
  });

  // ── GAME LOOP ──────────────────────────────────────────────────────────────
  const clock = new THREE.Clock();
  const SPEED = 28;

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    if (gameRunning) {
      // Map tilt to world coordinates
      const targetX =  (tiltX / 45) * 12;
      const targetY = -(tiltY / 45) * 5.5;

      // Smooth follow
      planeX += (targetX - planeX) * 4.5 * dt;
      planeY += (targetY - planeY) * 4.5 * dt;
      planeX  = Math.max(-14, Math.min(14, planeX));
      planeY  = Math.max(-4.5, Math.min(7.5, planeY));

      airplane.position.x = planeX;
      airplane.position.y = planeY;

      // Bank & pitch based on how fast we're turning
      airplane.rotation.z  =  (targetX - planeX) * 0.07;
      airplane.rotation.x  = -(targetY - planeY) * 0.08;

      // Spin propeller
      if (propeller) propeller.rotation.z += 18 * dt;

      // Camera follow (smooth)
      camera.position.x += (planeX     - camera.position.x) * 2.8 * dt;
      camera.position.y += (planeY + 5 - camera.position.y) * 2.8 * dt;
      camera.lookAt(planeX, planeY, -8);

      // Spawn timer
      spawnTimer += dt;
      if (spawnTimer > 1.1) {
        spawnTimer = 0;
        spawnCloud(-210);
        if (Math.random() > 0.2) spawnCoin(-185);
      }

      // Move clouds
      for (let i = clouds.length - 1; i >= 0; i--) {
        clouds[i].position.z += SPEED * clouds[i].userData.speed * dt;
        if (clouds[i].position.z > 22) { scene.remove(clouds[i]); clouds.splice(i, 1); }
      }

      // Move coins + collision
      for (let i = coins.length - 1; i >= 0; i--) {
        const c  = coins[i];
        c.position.z += SPEED * dt;
        c.rotation.z += 2.8 * dt;

        const dx = c.position.x - planeX;
        const dy = c.position.y - planeY;
        const dz = c.position.z - airplane.position.z;

        if (Math.sqrt(dx * dx + dy * dy + dz * dz) < 2.3) {
          score++;
          scoreEl.textContent = score;
          if (conn && conn.open) conn.send({ type: 'score', value: score });
          scene.remove(c); coins.splice(i, 1);
        } else if (c.position.z > 22) {
          scene.remove(c); coins.splice(i, 1);
        }
      }
    }

    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  </script>
</body>
</html>
