<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyCoins</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }

    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0, 20, 60, 0.88);
      color: white; z-index: 100;
    }
    #overlay h1 { font-size: 3.5rem; margin-bottom: 0.4rem; letter-spacing: 3px; }
    #overlay .sub { font-size: 1.1rem; opacity: 0.75; margin-bottom: 2rem; }
    #qrcode { background: white; padding: 12px; border-radius: 16px; box-shadow: 0 0 50px rgba(255,255,255,0.15); }
    #conn-info { margin-top: 1.2rem; font-size: 0.82rem; opacity: 0.45; letter-spacing: 1px; }
    #version { position: fixed; bottom: 10px; left: 14px; font-size: 0.75rem; opacity: 0.35; color: white; z-index: 200; letter-spacing: 1px; }

    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: center;
      padding: 18px; pointer-events: none; z-index: 10;
    }
    #score-box {
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
      border-radius: 40px; padding: 10px 30px;
      font-size: 1.9rem; font-weight: bold;
      color: #ffd700; text-shadow: 0 0 12px rgba(255,215,0,0.6);
    }
    #timer-box {
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
      border-radius: 40px; padding: 10px 30px;
      font-size: 1.9rem; font-weight: bold;
      color: #ffffff; margin-left: 18px;
      transition: color 0.3s;
    }

    #end-overlay {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0, 20, 60, 0.92);
      color: white; z-index: 110; gap: 0.6rem;
    }
    #end-overlay h2 { font-size: 2.4rem; letter-spacing: 2px; margin-bottom: 0.4rem; }
    #end-overlay .sub { font-size: 1.1rem; opacity: 0.7; }
    #end-score { font-size: 4.5rem; font-weight: bold; color: #ffd700; text-shadow: 0 0 24px rgba(255,215,0,0.55); line-height: 1.1; }
    #btn-restart {
      margin-top: 1.4rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; border: none;
      padding: 16px 44px; border-radius: 50px;
      font-size: 1.15rem; cursor: pointer;
      box-shadow: 0 4px 22px rgba(102,126,234,0.45);
      transition: transform .1s;
    }
    #btn-restart:active { transform: scale(0.95); }

    #status-pill {
      position: fixed; bottom: 22px; right: 22px;
      background: rgba(0,0,0,0.5); color: white;
      border-radius: 30px; padding: 8px 18px;
      font-size: 0.85rem; z-index: 10;
      backdrop-filter: blur(4px);
    }
    .pill-ok    { background: rgba(0,170,60,0.65)   !important; }
    .pill-err   { background: rgba(180,30,30,0.65)  !important; }
    .pill-calib { background: rgba(220,140,0,0.75)  !important; }

    #calib-wait {
      position: fixed; inset: 0;
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0, 10, 40, 0.72);
      color: white; z-index: 20;
      gap: 1rem; pointer-events: none;
    }
    #calib-wait-spinner {
      width: 50px; height: 50px;
      border: 4px solid rgba(255,255,255,0.18);
      border-top-color: #ffd700;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #calib-wait p {
      font-size: 1.15rem; opacity: 0.88;
      text-align: center; line-height: 1.6;
    }

    #lightning-flash {
      position: fixed; inset: 0;
      background: rgba(240, 250, 255, 0.95);
      pointer-events: none; z-index: 50;
      opacity: 0; transition: opacity 0.48s ease-out;
    }

    #hit-label {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.4rem; font-weight: bold;
      color: #ff4444; text-shadow: 0 0 18px rgba(255,60,60,0.7);
      pointer-events: none; z-index: 51;
      opacity: 0; transition: opacity 0.5s ease-out;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h1>✈️ SkyCoins</h1>
    <p class="sub">Scanne den QR-Code mit deinem Handy</p>
    <div id="qrcode"></div>
    <div id="conn-info">Verbindungs-ID wird geladen…</div>
  </div>

  <div id="hud" style="display:none">
    <div id="score-box">🪙 <span id="score-val">0</span></div>
    <div id="timer-box">⏱ <span id="timer-val">90</span>s</div>
  </div>

  <div id="end-overlay">
    <h2>⏱ Zeit abgelaufen!</h2>
    <p class="sub">Dein Score</p>
    <div id="end-score">0</div>
    <button id="btn-restart">🔄 Nochmal spielen</button>
  </div>
  <div id="status-pill">Warte auf Controller…</div>
  <div id="version">v2.7</div>

  <div id="calib-wait">
    <div id="calib-wait-spinner"></div>
    <p>Controller wird kalibriert…<br><span style="font-size:0.85rem;opacity:0.6">Spiel startet gleich</span></p>
  </div>

  <div id="lightning-flash"></div>
  <div id="hit-label">⚡ −10</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  // ── SCENE ──────────────────────────────────────────────────────────────────
  const scene    = new THREE.Scene();
  scene.fog      = new THREE.FogExp2(0x9dcef5, 0.007);

  const camera   = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 600);
  camera.position.set(0, 5, 14);
  camera.lookAt(0, 1, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const sun = new THREE.DirectionalLight(0xfff0cc, 1.3);
  sun.position.set(40, 80, -30);
  scene.add(sun);

  // Sky sphere with shader gradient
  const skyGeo = new THREE.SphereGeometry(450, 16, 8);
  const skyMat = new THREE.ShaderMaterial({
    uniforms: {
      topColor:    { value: new THREE.Color(0x1466cc) },
      bottomColor: { value: new THREE.Color(0x8ec8f6) }
    },
    vertexShader:   `varying float vY; void main(){ vY = position.y; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `varying float vY; uniform vec3 topColor,bottomColor; void main(){ gl_FragColor=vec4(mix(bottomColor,topColor,smoothstep(-80.,280.,vY)),1.); }`,
    side: THREE.BackSide
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  // ── AIRPLANE ───────────────────────────────────────────────────────────────
  let propeller = null;
  const airplane = new THREE.Group();
  scene.add(airplane);

  new GLTFLoader().load('Plane_blau.glb', gltf => {
    const model = gltf.scene;
    propeller = model.getObjectByName('Propeller');
    airplane.add(model);
  }, undefined, err => console.error('GLB Ladefehler:', err));

  // ── CLOUDS & COINS ─────────────────────────────────────────────────────────
  const clouds = [], coins = [];

  function spawnCloud(z) {
    const g   = new THREE.Group();
    const mat = new THREE.MeshPhongMaterial({ color: 0xfafafa, transparent: true, opacity: 0.9 });
    for (let i = 0; i < 5 + Math.floor(Math.random() * 5); i++) {
      const r    = 1.4 + Math.random() * 2.6;
      const puff = new THREE.Mesh(new THREE.SphereGeometry(r, 7, 6), mat.clone());
      puff.position.set((Math.random() - .5) * 7, (Math.random() - .5) * 2.5, (Math.random() - .5) * 4);
      g.add(puff);
    }
    g.position.set((Math.random() - .5) * 54, -2 + Math.random() * 14, z);
    g.userData.speed = 0.55 + Math.random() * 0.15;
    scene.add(g);
    clouds.push(g);
  }

  function spawnCoin(z) {
    const coin = new THREE.Mesh(
      new THREE.CylinderGeometry(0.55, 0.55, 0.14, 24),
      new THREE.MeshPhongMaterial({ color: 0xffd700, emissive: 0x996600, shininess: 160 })
    );
    coin.position.set((Math.random() - .5) * 18, -3.5 + Math.random() * 8, z);
    coin.rotation.x = Math.PI / 2;
    coin.userData.speed = 1;
    coin.userData.rotX = (Math.random() - 0.5) * 3;
    coin.userData.rotY = (Math.random() - 0.5) * 4;
    coin.userData.rotZ = (Math.random() - 0.5) * 3;
    scene.add(coin);
    coins.push(coin);
  }

  // Pre-populate scene
  for (let i = 0; i < 22; i++) spawnCloud(-20 - i * 9);
  for (let i = 0; i < 14; i++) spawnCoin(-18 - i * 14);

  // ── GAME STATE ─────────────────────────────────────────────────────────────
  let score = 0, gameRunning = false, gameOver = false;
  let timeLeft = 90;
  let tiltX = 0, tiltY = 0;
  let planeX = 0, planeY = 0;
  let spawnTimer = 0;
  const lightnings = [];
  let lightningTimer = 0;
  let lightningInterval = 2 + Math.random() * 5;

  const scoreEl = document.getElementById('score-val');
  const timerEl = document.getElementById('timer-val');

  // ── PEERJS ─────────────────────────────────────────────────────────────────
  const peer = new Peer(undefined, { debug: 0 });
  let conn = null;

  peer.on('open', id => {
    const base = location.href.replace(/[^/]*$/, '');
    const url  = base + 'controller.html?peer=' + id;
    new QRCode(document.getElementById('qrcode'), { text: url, width: 220, height: 220 });
    document.getElementById('conn-info').textContent = 'ID: ' + id;
  });

  peer.on('connection', c => {
    conn = c;
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('hud').style.display      = 'flex';

    const pill      = document.getElementById('status-pill');
    const calibWait = document.getElementById('calib-wait');

    // Wait for calibration — do NOT start game yet
    pill.textContent = '⏳ Kalibrierung…';
    pill.className   = 'pill-calib';
    calibWait.style.display = 'flex';
    gameRunning = false;

    c.on('data', d => {
      if (d.type === 'calibrated') {
        calibWait.style.display = 'none';
        gameRunning = true;
        pill.textContent = '🎮 Verbunden';
        pill.className   = 'pill-ok';
      }
      if (d.type === 'tilt') {
        tiltX = Math.max(-30, Math.min(30, d.gamma));
        tiltY = Math.max(-30, Math.min(30, d.beta));
      }
    });
    c.on('close', () => {
      gameRunning = false;
      calibWait.style.display = 'none';
      pill.textContent = '❌ Verbindung verloren';
      pill.className   = 'pill-err';
    });
  });

  // ── LIGHTNING ──────────────────────────────────────────────────────────────
  function spawnLightning() {
    const candidates = clouds.filter(c => c.position.z > -70 && c.position.z < -8);
    if (!candidates.length) return;
    const cloud = candidates[Math.floor(Math.random() * candidates.length)];

    const bx = cloud.position.x + (Math.random() - 0.5) * 3;
    const by = cloud.position.y - 1.5;
    const bz = cloud.position.z;

    const pts = [];
    let lx = 0, ly = 0;
    pts.push(new THREE.Vector3(0, 0, 0));
    const segments = 10 + Math.floor(Math.random() * 6);
    for (let i = 0; i < segments; i++) {
      lx += (Math.random() - 0.5) * 3.2;
      ly -= 2.0 + Math.random() * 1.5;
      pts.push(new THREE.Vector3(lx, ly, 0));
    }

    const geo     = new THREE.BufferGeometry().setFromPoints(pts);
    const glowGeo = new THREE.BufferGeometry().setFromPoints(pts);

    const mat     = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1 });
    const glowMat = new THREE.LineBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.35 });

    const bolt = new THREE.Line(geo, mat);
    const glow = new THREE.Line(glowGeo, glowMat);
    bolt.position.set(bx, by, bz);
    glow.position.set(bx, by, bz);

    bolt.userData.age   = 0;
    bolt.userData.life  = 1.0 + Math.random() * 0.6;
    bolt.userData.dropY = ly;
    bolt.userData.hit   = false;
    bolt.userData.glow  = glow;

    scene.add(glow);
    scene.add(bolt);
    lightnings.push(bolt);
  }

  // ── GAME LOOP ──────────────────────────────────────────────────────────────
  const clock = new THREE.Clock();
  const SPEED = 28;

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    if (gameRunning) {
      const velX =  (tiltX / 30) * 13;
      const velY = -(tiltY / 30) * 13;

      planeX += velX * dt;
      planeY += velY * dt;
      planeX  = Math.max(-14, Math.min(14, planeX));
      planeY  = Math.max(-6,  Math.min(16, planeY));

      airplane.position.x = planeX;
      airplane.position.y = planeY;

      // Bank & pitch basiert direkt auf Neigungswinkel
      const desiredRoll  = -(tiltX / 30) * 0.45;
      const desiredPitch = -(tiltY / 30) * 0.30;
      airplane.rotation.z += (desiredRoll  - airplane.rotation.z) * 5 * dt;
      airplane.rotation.x += (desiredPitch - airplane.rotation.x) * 5 * dt;

      // Spin propeller
      if (propeller) propeller.rotation.z += 18 * dt;

      // Camera follow (smooth)
      camera.position.x += (planeX     - camera.position.x) * 4 * dt;
      camera.position.y += (planeY + 5 - camera.position.y) * 4 * dt;
      camera.lookAt(planeX, planeY, -8);

      // Spawn timer
      spawnTimer += dt;
      if (spawnTimer > 1.1) {
        spawnTimer = 0;
        spawnCloud(-210);
        if (Math.random() > 0.2) spawnCoin(-185);
      }

      // Countdown timer
      timeLeft -= dt;
      const secsLeft = Math.ceil(timeLeft);
      timerEl.textContent = secsLeft;
      timerEl.parentElement.style.color = secsLeft <= 10 ? '#ff4444' : '#ffffff';
      if (timeLeft <= 0) { endGame(); return; }

      // Lightning spawn (random interval 2–7s, 30% chance of double strike)
      lightningTimer += dt;
      if (lightningTimer > lightningInterval) {
        lightningTimer = 0;
        lightningInterval = 2 + Math.random() * 5;
        const count = Math.random() < 0.3 ? 2 : 1;
        for (let b = 0; b < count; b++) spawnLightning();
      }

      // Update lightning bolts
      for (let i = lightnings.length - 1; i >= 0; i--) {
        const bolt = lightnings[i];
        bolt.userData.age += dt;
        bolt.position.z += SPEED * dt;
        if (bolt.userData.glow) bolt.userData.glow.position.z = bolt.position.z;

        // Flicker at ~20 Hz
        const flickerOn = Math.floor(bolt.userData.age * 20) % 2 === 0;
        bolt.material.opacity = flickerOn ? 1.0 : 0.1;
        if (bolt.userData.glow) bolt.userData.glow.material.opacity = flickerOn ? 0.35 : 0.0;

        // Collision when bolt passes through plane's z-plane
        if (!bolt.userData.hit && Math.abs(bolt.position.z) < 3) {
          const dx = Math.abs(bolt.position.x - planeX);
          const dy = bolt.position.y - planeY;
          if (dx < 2.5 && dy > -1 && dy < Math.abs(bolt.userData.dropY) + 1) {
            bolt.userData.hit = true;
            score = Math.max(0, score - 10);
            scoreEl.textContent = score;
            if (conn && conn.open) conn.send({ type: 'score', value: score });
            const flash    = document.getElementById('lightning-flash');
            const hitLabel = document.getElementById('hit-label');
            flash.style.opacity    = '1';
            hitLabel.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; hitLabel.style.opacity = '0'; }, 480);
          }
        }

        if (bolt.userData.age > bolt.userData.life || bolt.position.z > 22) {
          if (bolt.userData.glow) { scene.remove(bolt.userData.glow); bolt.userData.glow.geometry.dispose(); }
          scene.remove(bolt);
          bolt.geometry.dispose();
          lightnings.splice(i, 1);
        }
      }

      // Move clouds
      for (let i = clouds.length - 1; i >= 0; i--) {
        clouds[i].position.z += SPEED * clouds[i].userData.speed * dt;
        if (clouds[i].position.z > 22) { scene.remove(clouds[i]); clouds.splice(i, 1); }
      }

      // Move coins + collision
      for (let i = coins.length - 1; i >= 0; i--) {
        const c  = coins[i];
        c.position.z += SPEED * dt;
        c.rotation.x += c.userData.rotX * dt;
        c.rotation.y += c.userData.rotY * dt;
        c.rotation.z += c.userData.rotZ * dt;

        const dx = c.position.x - planeX;
        const dy = c.position.y - planeY;
        const dz = c.position.z - airplane.position.z;

        if (Math.sqrt(dx * dx + dy * dy + dz * dz) < 2.3) {
          score++;
          scoreEl.textContent = score;
          if (conn && conn.open) conn.send({ type: 'score', value: score });
          scene.remove(c); coins.splice(i, 1);
        } else if (c.position.z > 22) {
          scene.remove(c); coins.splice(i, 1);
        }
      }
    }

    renderer.render(scene, camera);
  }

  function endGame() {
    gameRunning = false;
    gameOver = true;
    document.getElementById('end-score').textContent = score;
    document.getElementById('end-overlay').style.display = 'flex';
    if (conn && conn.open) conn.send({ type: 'gameover', score });
  }

  function restartGame() {
    score = 0; timeLeft = 90; gameOver = false;
    planeX = 0; planeY = 0;
    scoreEl.textContent = 0;
    timerEl.textContent = 90;
    timerEl.parentElement.style.color = '#ffffff';

    [...coins].forEach(o => scene.remove(o));
    [...clouds].forEach(o => scene.remove(o));
    [...lightnings].forEach(o => {
      if (o.userData.glow) scene.remove(o.userData.glow);
      scene.remove(o);
    });
    coins.length = 0; clouds.length = 0; lightnings.length = 0;

    for (let i = 0; i < 22; i++) spawnCloud(-20 - i * 9);
    for (let i = 0; i < 14; i++) spawnCoin(-18 - i * 14);

    document.getElementById('end-overlay').style.display = 'none';
    gameRunning = true;
  }

  document.getElementById('btn-restart').addEventListener('click', restartGame);

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  </script>
</body>
</html>
